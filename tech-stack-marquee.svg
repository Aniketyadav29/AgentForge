<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="title description">
  <title id="title">Continuously moving technology stack</title>
  <desc id="description">A looping row of technology badges for Python, FastAPI, React, Docker, PostgreSQL, MongoDB, and GitHub Actions.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f172a"/><stop offset=".5" stop-color="#172554"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0f172a" stop-opacity="0"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  </defs>
  <rect width="1200" height="92" rx="16" fill="url(#background)"/>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1200 0" dur="24s" repeatCount="indefinite"/>
      <g transform="translate(18 20)"><rect width="126" height="52" rx="12" fill="#3776ab"/><text x="63" y="32" fill="#fff" text-anchor="middle">PYTHON</text></g>
      <g transform="translate(158 20)"><rect width="126" height="52" rx="12" fill="#009688"/><text x="63" y="32" fill="#fff" text-anchor="middle">FASTAPI</text></g>
      <g transform="translate(298 20)"><rect width="126" height="52" rx="12" fill="#087ea4"/><text x="63" y="32" fill="#fff" text-anchor="middle">REACT</text></g>
      <g transform="translate(438 20)"><rect width="126" height="52" rx="12" fill="#111827" stroke="#94a3b8"/><text x="63" y="32" fill="#fff" text-anchor="middle">NEXT.JS</text></g>
      <g transform="translate(578 20)"><rect width="126" height="52" rx="12" fill="#2496ed"/><text x="63" y="32" fill="#fff" text-anchor="middle">DOCKER</text></g>
      <g transform="translate(718 20)"><rect width="146" height="52" rx="12" fill="#336791"/><text x="73" y="32" fill="#fff" text-anchor="middle">POSTGRESQL</text></g>
      <g transform="translate(878 20)"><rect width="126" height="52" rx="12" fill="#47a248"/><text x="63" y="32" fill="#fff" text-anchor="middle">MONGODB</text></g>
      <g transform="translate(1018 20)"><rect width="164" height="52" rx="12" fill="#24292f"/><text x="82" y="32" fill="#fff" text-anchor="middle">GITHUB ACTIONS</text></g>
      <g transform="translate(1218 20)"><rect width="126" height="52" rx="12" fill="#3776ab"/><text x="63" y="32" fill="#fff" text-anchor="middle">PYTHON</text></g>
      <g transform="translate(1358 20)"><rect width="126" height="52" rx="12" fill="#009688"/><text x="63" y="32" fill="#fff" text-anchor="middle">FASTAPI</text></g>
      <g transform="translate(1498 20)"><rect width="126" height="52" rx="12" fill="#087ea4"/><text x="63" y="32" fill="#fff" text-anchor="middle">REACT</text></g>
      <g transform="translate(1638 20)"><rect width="126" height="52" rx="12" fill="#111827" stroke="#94a3b8"/><text x="63" y="32" fill="#fff" text-anchor="middle">NEXT.JS</text></g>
      <g transform="translate(1778 20)"><rect width="126" height="52" rx="12" fill="#2496ed"/><text x="63" y="32" fill="#fff" text-anchor="middle">DOCKER</text></g>
    </g>
  </g>
  <rect width="88" height="92" fill="url(#fadeLeft)"/><rect x="1112" width="88" height="92" fill="url(#fadeRight)"/>
</svg>
